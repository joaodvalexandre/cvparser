<section class="container wrap">
  <p class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>
  <h1 class="enter" style="--i: 3">{{ t.title }}</h1>
  <p class="muted enter" style="--i: 4">{{ t.text }}</p>
  <div class="actions enter" style="--i: 5">
    <a [routerLink]="i18n.link('/home')" class="btn btn-primary"><i class="bi bi-house" aria-hidden="true"></i> {{ t.home }}</a>
    <a [routerLink]="i18n.link('/projects')" class="btn btn-ghost">{{ t.projects }}</a>
  </div>
</section>
