<button
  type="button"
  class="btn"
  [class.btn-primary]="appearance() === 'primary'"
  [class.btn-ghost]="appearance() === 'ghost'"
  [class.compact]="compact()"
  [attr.aria-expanded]="open()"
  aria-haspopup="menu"
  (click)="toggle()">
  @if (pdf.busy()) {
    <span class="spinner" aria-hidden="true"></span>
  } @else {
    <i class="bi bi-download" aria-hidden="true"></i>
  }
  <span>{{ compact() ? 'CV' : 'Download CV' }}</span>
  <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
</button>

<div class="menu" role="menu" [class.open]="open()" [class.right]="align() === 'right'">
  @for (opt of options; track opt.variant) {
    <button type="button" role="menuitem" class="item" [disabled]="!!pdf.busy()" (click)="choose(opt.variant)">
      <span class="item-icon"><i class="bi {{ opt.icon }}" aria-hidden="true"></i></span>
      <span class="item-text">
        <strong>{{ opt.title }} <span class="tag">PDF</span></strong>
        <small>{{ opt.detail }}</small>
      </span>
      @if (pdf.busy() === opt.variant) {
        <span class="spinner" aria-label="Generating"></span>
      }
    </button>
  }
  @if (pdf.error(); as err) {
    <p class="error" role="alert">{{ err }}</p>
  }
</div>
