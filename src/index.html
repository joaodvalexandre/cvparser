<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>João Alexandre – Full-Stack PHP Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="João Alexandre – Full-Stack PHP Developer based in Lisbon. Experience, skills, projects and a downloadable CV.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1110" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="João Alexandre – Full-Stack PHP Developer">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <script>
    // Apply the saved / system theme before first paint (see ThemeService).
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
